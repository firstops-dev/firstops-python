[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firstops"
version = "0.2.0"
description = "Govern MCP, tool calls, and LLM traffic for AI agents — across LangGraph, Claude Agent SDK, and OpenAI Agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "FirstOps", email = "dev@firstops.dev" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
keywords = [
    "mcp", "dpop", "agent", "security", "governance", "llm",
    "langgraph", "langchain", "openai-agents", "claude", "guardrails",
]
dependencies = [
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://firstops.dev"
Documentation = "https://github.com/firstops-dev/firstops-python"
Repository = "https://github.com/firstops-dev/firstops-python"
Issues = "https://github.com/firstops-dev/firstops-python/issues"

[project.optional-dependencies]
# Per-harness extras: install the framework you use, e.g.
#   pip install "firstops[langgraph]"
langgraph = [
    "langchain>=1.0",
    "langgraph",
    "langchain-openai",
    "langchain-mcp-adapters",
]
claude = [
    "claude-agent-sdk",
]
openai = [
    "openai-agents",
]
all = [
    "langchain>=1.0",
    "langgraph",
    "langchain-openai",
    "langchain-mcp-adapters",
    "claude-agent-sdk",
    "openai-agents",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/firstops"]
